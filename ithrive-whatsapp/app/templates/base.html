<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}iThrive WhatsApp{% endblock %}</title>
<style>
  :root {
    --brand: #0b8a6e; --brand-soft: #e3f4ef; --ink: #121c29; --bg: #f5f7f9; --card: #ffffff;
    --text: #1b2533; --muted: #64707f; --line: #e2e7ec; --hot: #e5484d; --warm: #d97706; --cold: #64707f;
    --staff: #eef1ff; --client: #ffffff; --ai: #e3f4ef;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d141d; --card: #152030; --text: #e6ebf1; --muted: #93a0af; --line: #24324a;
      --brand-soft: #0f3a31; --staff: #1f2747; --client: #1a2738; --ai: #0f3a31; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--ink); color: #fff; padding: 12px 16px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  header b { font-size: 16px; } header b span { color: #4fd1ad; }
  header a { color: #c9d4df; text-decoration: none; } header a:hover { color: #fff; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stat .n { font-size: 24px; font-weight: 700; } .stat .l { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; } th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  tr.click:hover { background: var(--brand-soft); cursor: pointer; }
  .table-wrap { overflow-x: auto; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; border: 1px solid var(--line); white-space: nowrap; }
  .hot { color: #fff; background: var(--hot); border-color: var(--hot); }
  .warm { color: #fff; background: var(--warm); border-color: var(--warm); }
  .cold { color: var(--muted); }
  .human { background: #fff4d6; color: #7a5200; border-color: #f3d27a; }
  .muted { color: var(--muted); } .small { font-size: 12px; }
  a { color: var(--brand); }
  input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
  button { font: inherit; background: var(--brand); color: #fff; border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; }
  button.secondary { background: transparent; color: var(--brand); border: 1px solid var(--brand); }
  button.danger { background: var(--hot); }
  form.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  form.inline > * { width: auto; }
  .grid2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; } @media (max-width: 800px) { .grid2 { grid-template-columns: 1fr; } }
  .chat { display: flex; flex-direction: column; gap: 8px; max-height: 65vh; overflow-y: auto; padding: 4px; }
  .bubble { max-width: 80%; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); white-space: pre-wrap; word-wrap: break-word; }
  .bubble.in { align-self: flex-start; background: var(--client); }
  .bubble.out { align-self: flex-end; background: var(--ai); }
  .bubble.staff { background: var(--staff); }
  .bubble .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  dl { display: grid; grid-template-columns: 130px 1fr; gap: 6px 10px; margin: 0; } dt { color: var(--muted); }
  .field { margin-bottom: 8px; } .field label { display: block; color: var(--muted); font-size: 12px; }
  .ok { color: var(--brand); } .fail { color: var(--hot); }
</style>
</head>
<body>
<header>
  <b>iThrive <span>WhatsApp</span></b>
  <a href="/admin">Leads</a>
  <a href="/admin/knowledge">Knowledge base</a>
  <a href="/admin/export.csv">Export CSV</a>
  <span class="small muted" style="margin-left:auto">+91 93845 64915</span>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
